name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # El backend solo importa fastapi, pydantic y gitpython en runtime, asi que
      # backend/requirements.txt alcanza; pytest se agrega aparte porque no es
      # dependencia de la app.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      # El Dockerfile vive en la raiz y espera ese contexto: copia backend/app,
      # backend/tests y backend/requirements.txt.
      - name: Build image
        run: docker build -t project-analyzer .

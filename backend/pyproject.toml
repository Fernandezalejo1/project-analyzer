[project]
name = "project-analyzer"
version = "0.1.0"
description = "AI-powered software project analyzer and auditor"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "gitpython>=3.1.43",
    "tree-sitter>=0.23.0",
    "tree-sitter-languages>=1.10.0",
    "radon>=6.0.1",
    "bandit>=1.7.9",
    "safety>=3.2.0",
    "aiofiles>=24.1.0",
    "httpx>=0.27.0",
    "rich>=13.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
analyzer = "app.main:cli_main"

[build-system]
requires = ["setuptools>=75.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
